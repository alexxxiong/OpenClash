name: MU5250 adapter regression tests
on:
  push:
    branches: [codex/mu5250-integration]
    paths: ['contrib/mu5250/**', '.github/workflows/mu5250-adapter-tests.yml', 'luci-app-openclash/luasrc/controller/openclash.lua', 'luci-app-openclash/luasrc/view/openclash/myip.htm', 'luci-app-openclash/root/www/luci-static/resources/openclash/js/myip.js', 'luci-app-openclash/root/usr/share/openclash/openclash_streaming_unlock.lua']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: node --check luci-app-openclash/root/www/luci-static/resources/openclash/js/myip.js
      - run: node contrib/mu5250/test-diagnostic-ui.mjs
      - run: python3 contrib/mu5250/boot-tests/run_tests.py
      - run: python3 contrib/mu5250/boot-tests/test_ubus_readiness.py
      - run: python3 contrib/mu5250/clock-tests.py
      - run: python3 contrib/mu5250/network-tests/run_tests.py
